spring.application.name=server-spring
server.port=${PORT:8080}
app.client-origin=${CLIENT_ORIGIN:http://localhost:3000}

# --- Database (Postgres) ---
# Override with env vars. The app boots even when Postgres isn't running yet:
# Hibernate is told the dialect and not to probe JDBC metadata at startup,
# and Hikari won't fail fast. Endpoints that need the DB will error until it's up.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/girlmath}
spring.datasource.username=${DB_USER:girlmath}
spring.datasource.password=${DB_PASSWORD:girlmath}
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
